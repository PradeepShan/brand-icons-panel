<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Brand Icons</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    
    <!-- THE CACHE BUSTER: Adding ?v=2 forces Mac to download the newest script -->
    <script src="taskpane.js?v=2"></script>
    
    <style>
        body { font-family: -apple-system, sans-serif; padding: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .icon-card { border: 1px solid #ddd; border-radius: 6px; padding: 10px; cursor: pointer; text-align: center; }
        .icon-card:hover { background: #f3f2f1; border-color: #0078d4; }
        .icon-card img { max-width: 100%; height: auto; pointer-events: none; }
    </style>
</head>
<body>
    <h3>Brand Icons</h3>
    <p style="font-size: 12px;">Select an icon on the slide, then click below to swap.</p>
    
    <!-- TEMPORARY FIX: Added a direct test button to prove JavaScript is working -->
    <button onclick="alert('JavaScript is officially running!')" style="margin-bottom: 15px;">Test Button</button>
    
    <div class="grid">
        <!-- CHANGED to onclick for Mac trackpad compatibility -->
        <div class="icon-card" onclick="processIconClick('assets/home.svg')">
            <img src="assets/home.svg" alt="Home">
        </div>
        <div class="icon-card" onclick="processIconClick('assets/user.svg')">
            <img src="assets/user.svg" alt="User">
        </div>
    </div>
</body>
</html>
