
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Brand Icons</title>
    <!-- Microsoft Office.js Library -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="taskpane.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .icon-card { border: 1px solid #ddd; border-radius: 6px; padding: 10px; cursor: pointer; transition: 0.2s; text-align: center; }
        .icon-card:hover { background: #f3f2f1; border-color: #0078d4; }
        .icon-card img { max-width: 100%; height: auto; pointer-events: none; }
    </style>
</head>
<body>
    <h3>Brand Icons</h3>
    <p style="font-size: 12px; color: #666;">Select an icon on the slide, then double-click a new icon below to swap it.</p>
    
    <div class="grid">
        <!-- Add as many icons as you need here -->
        <div class="icon-card" ondblclick="processIconClick('assets/home.svg')">
            <img src="assets/Icon-$0-RGB.svg" alt="Home">
        </div>
        <div class="icon-card" ondblclick="processIconClick('assets/user.svg')">
            <img src="assets/Icon-BankCard-CirWhite-RGB.svg" alt="User">
        </div>
    </div>
</body>
</html>
